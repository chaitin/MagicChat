appId: chat.jiying.desktop.next
productName: 即应
artifactName: "Jiying-Desktop-Preview-${version}-win-${arch}.${ext}"
asar: true
electronDownload:
  mirrorOptions:
    mirror: https://npmmirror.com/mirrors/electron/
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
extraMetadata:
  description: 即应新桌面客户端 Windows 预览版
win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch:
        - x64
  signExecutable: false
  verifyUpdateCodeSignature: false
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  shortcutName: 即应
  uninstallDisplayName: 即应新桌面客户端预览版
