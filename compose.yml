name: magic-chat

# Project images are pulled through the GHCR mirror by default.
services:
  postgres:
    container_name: magic-chat-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-magic-chat}
      POSTGRES_USER: ${POSTGRES_USER:-magic-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
    volumes:
      - ./data/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  assistant:
    container_name: magic-chat-assistant
    image: ${IMAGE_REGISTRY:-ghcr.1ms.run/chaitin/magicchat}/assistant:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      LOG_FILE: /app/log/assistant.log
      AI_ASSISTANT_SECRET: ${AI_ASSISTANT_SECRET:-change-me}
      ASSISTANT_WEBSOCKET_URL: ${ASSISTANT_WEBSOCKET_URL:-ws://server:20080/api/app/ws}
      AGENT_MAX_TURNS: ${AGENT_MAX_TURNS:-50}
      AGENT_MAX_SESSIONS: ${AGENT_MAX_SESSIONS:-1000}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.example.com}
      LLM_API_KEY: ${LLM_API_KEY:-change-me}
      LLM_MODEL_NAME: ${LLM_MODEL_NAME:-change-me}
      MCP_GATEWAY_URL: ${MCP_GATEWAY_URL:-https://mcp.example.com/mcp}
      MCP_GATEWAY_KEY: ${MCP_GATEWAY_KEY:-change-me}
    volumes:
      - ./data/assistant/log:/app/log

  server:
    container_name: magic-chat-server
    image: ${IMAGE_REGISTRY:-ghcr.1ms.run/chaitin/magicchat}/server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-magic-chat}
      POSTGRES_USER: ${POSTGRES_USER:-magic-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      CLIENT_HTTPS_PORT: ${CLIENT_HTTPS_PORT:-443}
      ADMIN_HTTPS_PORT: ${ADMIN_HTTPS_PORT:-1443}
      PUBLIC_ASSETS_HOSTNAME: ${PUBLIC_ASSETS_HOSTNAME:-public-assets.localhost}
      PRIVATE_ASSETS_HOSTNAME: ${PRIVATE_ASSETS_HOSTNAME:-private-assets.localhost}
      TEMPORARY_ASSETS_HOSTNAME: ${TEMPORARY_ASSETS_HOSTNAME:-temporary-assets.localhost}
      AI_ASSISTANT_SECRET: ${AI_ASSISTANT_SECRET:-change-me}
      ASRMODEL_API_KEY: ${ASRMODEL_API_KEY:-change-me}
      PUSH_GATEWAY_ENABLED: ${PUSH_GATEWAY_ENABLED:-false}
      PUSH_CREDENTIAL_ENCRYPTION_KEY: ${PUSH_CREDENTIAL_ENCRYPTION_KEY:-}
      PUSH_CREDENTIAL_PREVIOUS_KEYS: ${PUSH_CREDENTIAL_PREVIOUS_KEYS:-}
      PUSH_GATEWAY_SERVER_KEY: ${PUSH_GATEWAY_SERVER_KEY:-}
      AWS_ENDPOINT_URL_S3: ${AWS_ENDPOINT_URL_S3:-https://s3.example.com}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-change-me}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-change-me}
      S3_BOOTSTRAP_ENABLED: ${S3_BOOTSTRAP_ENABLED:-false}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      PUBLIC_ASSETS_BUCKET: ${PUBLIC_ASSETS_BUCKET:-magicchat-public}
      PRIVATE_ASSETS_BUCKET: ${PRIVATE_ASSETS_BUCKET:-magicchat-private}
      TEMPORARY_ASSETS_BUCKET: ${TEMPORARY_ASSETS_BUCKET:-magicchat-temporary}
      TEMPORARY_ASSETS_EXPIRE_DAYS: ${TEMPORARY_ASSETS_EXPIRE_DAYS:-180}
      S3_ABORT_MULTIPART_DAYS: ${S3_ABORT_MULTIPART_DAYS:-7}
    volumes:
      - ./data/server/log:/app/log
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20080/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  document-server:
    container_name: magic-chat-document-server
    image: ${IMAGE_REGISTRY:-ghcr.1ms.run/chaitin/magicchat}/document-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    stop_grace_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-magic-chat}
      POSTGRES_USER: ${POSTGRES_USER:-magic-chat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      DOCUMENT_SERVER_HOST: 0.0.0.0
      DOCUMENT_SERVER_PORT: 20100
      DOCUMENT_ALLOWED_ORIGINS: ${DOCUMENT_ALLOWED_ORIGINS:-}
      DOCUMENT_AUTH_RECHECK_MS: ${DOCUMENT_AUTH_RECHECK_MS:-30000}
      DOCUMENT_STORE_DEBOUNCE_MS: ${DOCUMENT_STORE_DEBOUNCE_MS:-2000}
      DOCUMENT_STORE_MAX_DEBOUNCE_MS: ${DOCUMENT_STORE_MAX_DEBOUNCE_MS:-10000}
      DOCUMENT_PERSISTENCE_RETRY_INITIAL_MS: ${DOCUMENT_PERSISTENCE_RETRY_INITIAL_MS:-250}
      DOCUMENT_PERSISTENCE_RETRY_MAX_MS: ${DOCUMENT_PERSISTENCE_RETRY_MAX_MS:-5000}
      DOCUMENT_SHUTDOWN_TIMEOUT_MS: ${DOCUMENT_SHUTDOWN_TIMEOUT_MS:-30000}
      DOCUMENT_MAX_MESSAGE_BYTES: ${DOCUMENT_MAX_MESSAGE_BYTES:-16777216}
      DOCUMENT_DB_POOL_SIZE: ${DOCUMENT_DB_POOL_SIZE:-10}
      DOCUMENT_DB_CONNECTION_TIMEOUT_MS: ${DOCUMENT_DB_CONNECTION_TIMEOUT_MS:-5000}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:20100/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  prometheus:
    container_name: magic-chat-prometheus
    image: prom/prometheus:v2.55.1
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/push-alerts.yml:/etc/prometheus/rules/push-alerts.yml:ro
      - prometheus-data:/prometheus

  caddy:
    container_name: magic-chat-caddy
    image: ${IMAGE_REGISTRY:-ghcr.1ms.run/chaitin/magicchat}/caddy:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      document-server:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:-localhost}
      CLIENT_HTTPS_PORT: ${CLIENT_HTTPS_PORT:-443}
    ports:
      - "80:80"
      - "${CLIENT_HTTPS_PORT:-443}:443"
      - "${ADMIN_HTTPS_PORT:-1443}:1443"
    volumes:
      - ./data/caddy/data:/data
      - ./data/caddy/config:/config
      - ./data/caddy/logs:/var/log/caddy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  prometheus-data:
