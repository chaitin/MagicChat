name: Desktop Release

on:
  push:
    tags:
      - "desktop/*"

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: 验证发布标签
        shell: bash
        run: node client/desktop/scripts/verify-release-tag.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA"
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/desktop/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: client/desktop
        run: pnpm install --frozen-lockfile
      - name: 类型检查、测试与构建
        working-directory: client/desktop
        run: pnpm typecheck && pnpm test && pnpm test:release && pnpm build

  package:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            target: nsis
            arch: x64
          - runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
          - runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
          - runner: macos-15
            platform: mac
            target: dmg
            arch: universal
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/desktop/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: client/desktop
        run: pnpm install --frozen-lockfile
      - name: 构建新桌面客户端
        working-directory: client/desktop
        run: pnpm build
      - name: 构建 macOS 签名及公证制品
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: client/desktop
        env:
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          NOTARY_API_KEY_BASE64: ${{ secrets.MACOS_NOTARY_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          : "${APPLE_API_ISSUER:?缺少 APPLE_API_ISSUER}"
          : "${APPLE_API_KEY_ID:?缺少 APPLE_API_KEY_ID}"
          : "${CSC_KEY_PASSWORD:?缺少 MACOS_CERTIFICATE_PASSWORD}"
          : "${CSC_LINK:?缺少 MACOS_CERTIFICATE_P12_BASE64}"
          : "${NOTARY_API_KEY_BASE64:?缺少 MACOS_NOTARY_API_KEY_P8_BASE64}"
          umask 077
          api_key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$api_key_path"' EXIT
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 -D > "$api_key_path"
          unset NOTARY_API_KEY_BASE64
          export APPLE_API_KEY="$api_key_path"
          pnpm exec electron-builder --mac dmg --universal --config electron-builder.yml --publish never
      - name: 验证 macOS 签名与公证
        if: matrix.platform == 'mac'
        shell: bash
        working-directory: client/desktop
        run: |
          set -euo pipefail
          dmg=(dist/*.dmg)
          test "${#dmg[@]}" -eq 1
          mountpoint="$RUNNER_TEMP/desktop-release-dmg"
          mkdir "$mountpoint"
          hdiutil attach -readonly -nobrowse -mountpoint "$mountpoint" "${dmg[0]}"
          trap 'hdiutil detach "$mountpoint"' EXIT
          app="$mountpoint/即应.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          archs="$(lipo -archs "$app/Contents/MacOS/即应")"
          [[ " $archs " == *" x86_64 "* && " $archs " == *" arm64 "* ]]
      - name: 构建 Windows / Linux 制品
        if: matrix.platform != 'mac'
        working-directory: client/desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder --${{ matrix.platform }} ${{ matrix.target }} --${{ matrix.arch }} --config electron-builder.yml --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            client/desktop/dist/*.exe
            client/desktop/dist/*.dmg
            client/desktop/dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [quality, package]
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true
      - name: 校验四个平台产物并生成发布计划
        run: node client/desktop/scripts/prepare-release-plan.mjs --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --input artifacts --output "$RUNNER_TEMP/desktop-release-plan"
      - name: 通过 Draft 事务发布并核对远端文件摘要
        env:
          GH_TOKEN: ${{ github.token }}
        run: node client/desktop/scripts/publish-release.mjs --plan "$RUNNER_TEMP/desktop-release-plan/release-plan.json" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
