name: Desktop PR

on:
  pull_request:
    paths:
      - "client/desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
          - name: macOS universal
            runner: macos-15
          - name: Linux x64
            runner: ubuntu-24.04
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.3
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/desktop/pnpm-lock.yaml
      - name: 安装依赖
        working-directory: client/desktop
        run: pnpm install --frozen-lockfile
      - name: 类型检查和测试
        working-directory: client/desktop
        run: pnpm typecheck && pnpm test && pnpm test:release
      - name: 构建新桌面客户端
        working-directory: client/desktop
        run: pnpm build
